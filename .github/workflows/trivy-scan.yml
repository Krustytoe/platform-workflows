name: trivy-scan

on:
  workflow_call:
    inputs:
      scan_type:
        description: "Scan type: \"fs\" (vulns/secrets), \"config\" (IaC misconfig), or \"image\" (container image)."
        type: string
        default: "fs"
      target:
        description: "Path for fs scans; image reference (e.g. \"nginx:latest\") for image scans."
        type: string
        default: "."
      severity:
        description: "Comma-separated severities to report."
        type: string
        default: "HIGH,CRITICAL"
      upload_sarif:
        description: "Upload SARIF results to GitHub Security tab."
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan_type }}
          scan-ref: ${{ inputs.scan_type != 'image' && inputs.target || '' }}
          image-ref: ${{ inputs.scan_type == 'image' && inputs.target || '' }}
          severity: ${{ inputs.severity }}
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: inputs.upload_sarif
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif

      - name: Print findings summary
        run: |
          python3 - <<'EOF'
          import json, sys
          data = json.load(open("trivy-results.sarif"))
          results = data.get("runs", [{}])[0].get("results", [])
          if not results:
              print("No findings.")
              sys.exit(0)
          counts = {}
          for r in results:
              level = r.get("level", "note")
              counts[level] = counts.get(level, 0) + 1
          print("Findings:", ", ".join(f"{v} {k}" for k, v in sorted(counts.items())))
          EOF
