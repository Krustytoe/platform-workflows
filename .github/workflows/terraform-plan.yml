name: terraform-plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform configuration, relative to repo root."
        type: string
        required: true
      terraform_version:
        description: "Terraform version constraint, e.g. \"~1.10\"."
        type: string
        default: "~1.10"
      cloud:
        description: "Cloud provider for authentication: \"aws\", \"azure\", or empty to skip auth."
        type: string
        default: ""
      aws_region:
        description: "AWS region. Required when cloud = \"aws\"."
        type: string
        default: ""
      upload_plan:
        description: "Upload the saved plan as an artifact so terraform-apply applies exactly what was reviewed."
        type: boolean
        default: false
      plan_artifact_name:
        description: "Artifact name for the saved plan. Must be unique per working directory within a run."
        type: string
        default: "tfplan"
    outputs:
      has_changes:
        description: "\"true\" when the plan contains changes (terraform plan -detailed-exitcode returned 2)."
        value: ${{ jobs.plan.outputs.has_changes }}
    secrets:
      AWS_ROLE_ARN:
        description: "IAM role ARN to assume via OIDC. Required when cloud = \"aws\"."
        required: false
      AZURE_CLIENT_ID:
        description: "Managed identity client ID. Required when cloud = \"azure\"."
        required: false
      AZURE_TENANT_ID:
        description: "Azure tenant ID. Required when cloud = \"azure\"."
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: "Azure subscription ID. Required when cloud = \"azure\"."
        required: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Steps from this repo's composite actions are inlined rather than referenced: a reusable workflow
      # can't pin its own repo's actions to its own SHA, and GITHUB_TOKEN can't commit version bumps
      # to workflow files. Keep in sync with actions/*/action.yml.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - name: tflint init
        working-directory: .
        run: tflint --init

      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions

      - name: Authenticate to Azure
        if: inputs.cloud == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: fmt check
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate

      - name: tflint
        run: tflint --recursive

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      - name: plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -out=tfplan 2>&1 | tee /tmp/tfplan.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then has_changes=true; else has_changes=false; fi
          echo "has_changes=${has_changes}" >> "$GITHUB_OUTPUT"

      # Job summary is what an environment approver sees on the run page before approving apply.
      - name: Write plan to job summary
        if: always() && steps.plan.outputs.exit_code != ''
        env:
          WORKING_DIR: ${{ inputs.working_directory }}
        run: |
          {
            echo "## Terraform plan: \`${WORKING_DIR}\`"
            echo
            echo '```'
            head -c 900000 /tmp/tfplan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIR: ${{ inputs.working_directory }}
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            const maxLen = 65000;
            const body = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n_Output truncated — see workflow logs for the full plan._'
              : plan;
            const icon = { '0': '✅ No changes', '2': '📝 Changes' }[process.env.PLAN_EXIT_CODE] ?? '❌ Failed';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `## ${icon}: Terraform Plan — \`${process.env.WORKING_DIR}\``,
                '',
                '<details><summary>Show plan output</summary>',
                '',
                '```',
                body,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });

      # The plan file can contain sensitive values in plaintext: keep retention short.
      - name: Upload plan
        if: inputs.upload_plan && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1
          if-no-files-found: error

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code != '0' && steps.plan.outputs.exit_code != '2'
        run: exit 1
