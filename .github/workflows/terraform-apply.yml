name: terraform-apply

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform configuration, relative to repo root."
        type: string
        required: true
      environment:
        description: "GitHub environment for this job. Its protection rules (required reviewers) are the approval gate before apply."
        type: string
        required: true
      plan_artifact_name:
        description: "Plan artifact uploaded by terraform-plan (upload_plan: true) earlier in this run. When set, applies exactly that reviewed plan."
        type: string
        default: ""
      terraform_version:
        description: "Terraform version constraint, e.g. \"~1.10\". Must match the version that produced the plan."
        type: string
        default: "~1.10"
      cloud:
        description: "Cloud provider for authentication: \"aws\", \"azure\", or empty to skip auth."
        type: string
        default: ""
      aws_region:
        description: "AWS region. Required when cloud = \"aws\"."
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    # Environments can't be set on a job that calls a reusable workflow, so the gate is declared here.
    # This also makes the OIDC subject claim repo:<org>/<repo>:environment:<name>, which the
    # github-oidc-role modules in terraform-aws/azure-platform-modules trust.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Steps from this repo's composite actions are inlined rather than referenced: a reusable workflow
      # can't pin its own repo's actions to its own SHA, and GITHUB_TOKEN can't commit version bumps
      # to workflow files. Keep in sync with actions/*/action.yml.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint init
        working-directory: .
        run: tflint --init

      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions

      - name: Authenticate to Azure
        if: inputs.cloud == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: init
        run: terraform init -input=false

      - name: Download reviewed plan
        if: inputs.plan_artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.working_directory }}

      # A saved plan applies without prompting, and Terraform refuses it if state changed since it was made.
      - name: apply reviewed plan
        if: inputs.plan_artifact_name != ''
        run: terraform apply -input=false tfplan

      - name: apply (fresh plan, not reviewed)
        if: inputs.plan_artifact_name == ''
        run: |
          echo "::warning::No plan_artifact_name given: applying a fresh plan nobody reviewed. Use terraform-plan with upload_plan: true."
          terraform apply -auto-approve -input=false
