name: "Terraform Setup"
description: "Install Terraform and tflint at consistent versions, then run tflint --init."

inputs:
  terraform_version:
    description: "Terraform version constraint."
    required: false
    default: "~1.10"
  tflint_version:
    description: "tflint version."
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Setup tflint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: ${{ inputs.tflint_version }}

    - name: tflint init
      shell: bash
      run: tflint --init
