name: "AWS OIDC Auth"
description: "Authenticate to AWS via OIDC — no long-lived access keys. Requires id-token: write on the calling job."

inputs:
  role_arn:
    description: "IAM role ARN to assume (from terraform-aws-platform-modules//modules/github-oidc-role)."
    required: true
  region:
    description: "AWS region, e.g. \"us-east-1\" or \"us-gov-west-1\"."
    required: true
  session_name:
    description: "Session name recorded in CloudTrail for audit purposes."
    required: false
    default: "github-actions"

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}
        role-session-name: ${{ inputs.session_name }}
